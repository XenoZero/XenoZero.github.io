<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易胜利动画</title>
<style>
  body {
    margin: 0;
    overflow: hidden; /* 隐藏超出视口的内容 */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial Black', Gadget, sans-serif; /* 使用粗体字体 */
    background: #1a0f3d; /* 初始深色背景 */
    animation: backgroundChange 4s ease-in-out forwards; /* 背景动画 */
  }

  .victory-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column; /* 垂直排列文字和图片 */
    justify-content: center;
    align-items: center;
  }

  .victory-text, .victory-image {
    opacity: 0;
    transform: scale(0.5); /* 初始缩小 */
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), /* 初始发光 */
                 0 0 20px rgba(255, 255, 255, 0.3);
    animation: textAppear 2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; /* 文本/图片出现动画 */
  }

  .victory-text {
    font-size: 8vw; /* 响应式字体大小 */
    color: #fff;
    letter-spacing: 0.1em; /* 增加字母间距 */
    z-index: 2; /* 确保文字在图片上 */
    animation: textAppear 2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards, /* 文本动画 */
               textGlow 1.5s infinite alternate 2s; /* 发光动画，延迟开始 */
  }

  .victory-image {
    width: 20vw; /* 图片宽度，响应式 */
    max-width: 400px; /* 最大宽度 */
    height: auto;
    margin-top: 20px; /* 与文字的间距 */
    animation-delay: 0.5s; /* 图片动画稍晚于文字开始 */
    z-index: 1; /* 图片在文字下方 */
  }

  /* 背景颜色渐变动画 */
  @keyframes backgroundChange {
    0% { background: #1a0f3d; }
    50% { background: #3d1a6e; } /* 动画中途变为紫色 */
    100% { background: #000; } /* 最终变为黑色或更深的颜色 */
  }

  /* 文本/图片出现动画 */
  @keyframes textAppear {
    0% {
      opacity: 0;
      transform: scale(0.5);
    }
    70% { /* 稍微过冲一下，形成弹性效果 */
      opacity: 1;
      transform: scale(1.1);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* 文本持续发光动画 */
  @keyframes textGlow {
    0% {
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8), /* 青色系发光 */
                   0 0 30px rgba(0, 255, 255, 0.6);
    }
    100% {
      text-shadow: 0 0 25px rgba(0, 255, 255, 1),
                   0 0 50px rgba(0, 255, 255, 0.8);
    }
  }

  /* 粒子效果 (简易版：模拟小方块从中心扩散) */
  .particle-container {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    background-color: rgba(255, 255, 0, 0.7); /* 黄色 */
    width: 8px;
    height: 8px;
    border-radius: 50%; /* 圆形粒子 */
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* 居中 */
    opacity: 0;
    animation: particleBurst 3s ease-out forwards;
  }

  /* 批量创建粒子并设置不同延迟，需要JavaScript或重复编写CSS */
  /* 这里只演示了3个粒子 */
  .particle:nth-child(1) { animation-delay: 0.2s; background-color: rgba(255, 255, 0, 0.7); --x-dir: 1; --y-dir: 1; }
  .particle:nth-child(2) { animation-delay: 0.4s; background-color: rgba(0, 255, 255, 0.7); --x-dir: -1; --y-dir: 0.5;}
  .particle:nth-child(3) { animation-delay: 0.6s; background-color: rgba(255, 0, 255, 0.7); --x-dir: 0.5; --y-dir: -1;}


  @keyframes particleBurst {
    0% {
      opacity: 0.8;
      transform: translate(-50%, -50%) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + (var(--x-dir, 0) * 300px)), calc(-50% + (var(--y-dir, 0) * 300px))) scale(0); /* 随机方向扩散 */
    }
  }
</style>
</head>
<body>
  <div class="victory-container">
    <div class="victory-text">Team Niko</div>
    <img src="nikoMeMe.jpg" alt="Victory Image" class="victory-image"> <div class="particle-container">
      <div class="particle" style="--x-dir: 1; --y-dir: 1;"></div>
      <div class="particle" style="--x-dir: -1; --y-dir: 0.5;"></div>
      <div class="particle" style="--x-dir: 0.5; --y-dir: -1;"></div>
    </div>
  </div>
</body>
</html>
