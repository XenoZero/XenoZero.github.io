<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易胜利动画</title>
<style>
  body {
    margin: 0;
    overflow: hidden; /* 隐藏超出视口的内容 */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial Black', Gadget, sans-serif; /* 使用粗体字体 */
    background: #1a0f3d; /* 初始深色背景 */
    animation: backgroundChange 4s ease-in-out forwards; /* 背景动画 */
  }

  .victory-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .victory-text {
    font-size: 8vw; /* 响应式字体大小 */
    color: #fff;
    opacity: 0;
    transform: scale(0.5); /* 初始缩小 */
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), /* 初始发光 */
                 0 0 20px rgba(255, 255, 255, 0.3);
    animation: textAppear 2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards, /* 文本动画 */
               textGlow 1.5s infinite alternate 2s; /* 发光动画，延迟开始 */
    letter-spacing: 0.1em; /* 增加字母间距 */
  }

  /* 背景颜色渐变动画 */
  @keyframes backgroundChange {
    0% { background: #1a0f3d; }
    50% { background: #3d1a6e; } /* 动画中途变为紫色 */
    100% { background: #000; } /* 最终变为黑色或更深的颜色 */
  }

  /* 文本出现动画 */
  @keyframes textAppear {
    0% {
      opacity: 0;
      transform: scale(0.5);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    70% { /* 稍微过冲一下，形成弹性效果 */
      opacity: 1;
      transform: scale(1.1);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                   0 0 40px rgba(255, 255, 255, 0.6);
    }
    100% {
      opacity: 1;
      transform: scale(1);
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.7),
                   0 0 30px rgba(255, 255, 255, 0.5);
    }
  }

  /* 文本持续发光动画 */
  @keyframes textGlow {
    0% {
      text-shadow: 0 0 15px rgba(0, 255, 255, 0.8), /* 青色系发光 */
                   0 0 30px rgba(0, 255, 255, 0.6);
    }
    100% {
      text-shadow: 0 0 25px rgba(0, 255, 255, 1),
                   0 0 50px rgba(0, 255, 255, 0.8);
    }
  }

  /* 粒子效果 (简易版：模拟小方块从中心扩散) */
  .particle-container {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    background-color: rgba(255, 255, 0, 0.7); /* 黄色 */
    width: 8px;
    height: 8px;
    border-radius: 50%; /* 圆形粒子 */
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* 居中 */
    opacity: 0;
    animation: particleBurst 3s ease-out forwards;
  }

  /* 批量创建粒子并设置不同延迟，需要JavaScript或重复编写CSS */
  /* 这里只演示一个，实际中会用JS生成多个 */
  .particle:nth-child(1) { animation-delay: 0.2s; }
  .particle:nth-child(2) { animation-delay: 0.4s; background-color: rgba(0, 255, 255, 0.7); }
  .particle:nth-child(3) { animation-delay: 0.6s; background-color: rgba(255, 0, 255, 0.7); }
  /* ... 更多粒子 */


  @keyframes particleBurst {
    0% {
      opacity: 0.8;
      transform: translate(-50%, -50%) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + (var(--x-dir) * 300px)), calc(-50% + (var(--y-dir) * 300px))) scale(0); /* 随机方向扩散 */
    }
  }

  /* 为了让粒子有随机方向，更推荐使用JavaScript动态设置 --x-dir 和 --y-dir 变量 */

</style>
</head>
<body>
  <div class="victory-container">
    <div class="victory-text">Team Falcons</div>
    <div class="particle-container">
      <div class="particle" style="--x-dir: 1; --y-dir: 1;"></div>
      <div class="particle" style="--x-dir: -1; --y-dir: 0.5;"></div>
      <div class="particle" style="--x-dir: 0.5; --y-dir: -1;"></div>
    </div>
  </div>
</body>
</html>
